name: Weekly TV M3U Sync

on:
  schedule:
    - cron: "0 0 * * 0"  # every Sunday (weekly)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download remote file
        run: |
          curl -L "https://raw.githubusercontent.com/Shakil1294/pcv/refs/heads/main/tv.m3u" -o remote.m3u

      - name: Check if local file exists
        run: |
          mkdir -p src/m3u_final
          touch src/m3u_final/tv.m3u

      - name: Compare files
        id: diffcheck
        run: |
          if diff -q remote.m3u src/m3u_final/tv.m3u > /dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Backup + Replace if changed
        if: steps.diffcheck.outputs.changed == 'true'
        run: |
          mkdir -p backups

          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          cp src/m3u_final/tv.m3u backups/tv_$TIMESTAMP.m3u

          mv remote.m3u src/m3u_final/tv.m3u

      - name: Commit changes
        if: steps.diffcheck.outputs.changed == 'true'
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"

          git add src/m3u_final/tv.m3u backups/

          git commit -m "Weekly M3U sync update + backup"

          git push
