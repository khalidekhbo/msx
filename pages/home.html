<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Satisfy&display=swap');

body {
    background: #000;
    color: #fff;
    font-family: 'Satisfy', cursive;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 1rem;
}

#time-container {
    display: flex;
    align-items: baseline;
    justify-content: center;
    margin-bottom: 0.25rem;
}

#time {
    font-size: 5rem;
    line-height: 1;
}

#ampm {
    font-size: 1.8rem;
    margin-left: 0.5rem;
}

#date {
    font-size: 1.8rem;
    opacity: 0.8;
    margin-bottom: 2rem;
}

/* Compact Weather Forecast */
#forecast-container {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 900px;
    font-family: system-ui, sans-serif;
}

.forecast-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 0.5rem;
    min-width: 65px;
    backdrop-filter: blur(5px);
}

.day-name {
    font-size: 0.7rem;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 0.2rem;
}

.weather-icon {
    font-size: 1.2rem;
    margin-bottom: 0.2rem;
}

.temp-range {
    font-size: 0.8rem;
    font-weight: 600;
}

.temp-low {
    opacity: 0.5;
    margin-left: 0.2rem;
}

#status {
    font-family: system-ui, sans-serif;
    font-size: 0.75rem;
    opacity: 0.5;
    margin-top: 1rem;
}
</style>
</head>

<body>

<div id="time-container">
    <div id="time"></div>
    <div id="ampm"></div>
</div>

<div id="date"></div>

<div id="forecast-container"></div>

<div id="status"></div>

<script>
function updateClock() {
    const now = new Date();

    let hours = now.getHours();
    const ampm = hours >= 12 ? 'PM' : 'AM';

    hours = hours % 12 || 12;

    const time =
        String(hours).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0') + ':' +
        String(now.getSeconds()).padStart(2, '0');

    document.getElementById('time').textContent = time;
    document.getElementById('ampm').textContent = ampm;

    document.getElementById('date').textContent =
        now.toLocaleDateString(undefined, {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
}

const weatherIcons = {
    0: '☀️',
    1: '🌤️',
    2: '⛅',
    3: '☁️',
    45: '🌫️',
    48: '🌫️',
    51: '🌦️',
    53: '🌦️',
    55: '🌦️',
    61: '🌧️',
    63: '🌧️',
    65: '🌧️',
    71: '🌨️',
    73: '🌨️',
    75: '🌨️',
    80: '🌦️',
    81: '🌧️',
    82: '⛈️',
    95: '⛈️',
    96: '⛈️',
    99: '⛈️'
};

async function loadForecast() {

    const container = document.getElementById('forecast-container');
    const status = document.getElementById('status');

    try {

        // Dhaka
        const latitude = 23.8103;
        const longitude = 90.4125;

        const response = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=weathercode,temperature_2m_max,temperature_2m_min&forecast_days=7&timezone=auto`
        );

        const data = await response.json();

        container.innerHTML = '';

        data.daily.time.forEach((date, index) => {

            const day = new Date(date).toLocaleDateString('en-US', {
                weekday: 'short'
            });

            const code = data.daily.weathercode[index];

            const icon = weatherIcons[code] || '❓';

            const high = Math.round(
                data.daily.temperature_2m_max[index]
            );

            const low = Math.round(
                data.daily.temperature_2m_min[index]
            );

            const card = document.createElement('div');
            card.className = 'forecast-card';

            card.innerHTML = `
                <div class="day-name">${day}</div>
                <div class="weather-icon">${icon}</div>
                <div class="temp-range">
                    ${high}°
                    <span class="temp-low">${low}°</span>
                </div>
            `;

            container.appendChild(card);
        });

        status.textContent = 'Weather updated';

    } catch (err) {

        console.error(err);

        status.textContent =
            'Unable to load weather data';

        container.innerHTML = `
            <div style="font-family:system-ui,sans-serif;opacity:.7">
                Weather unavailable
            </div>
        `;
    }
}

updateClock();
setInterval(updateClock, 1000);

loadForecast();

/* Refresh weather every hour */
setInterval(loadForecast, 60 * 60 * 1000);
</script>

</body>
</html>
